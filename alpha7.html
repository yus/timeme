<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeMe • Color Capture Timer</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface2: #1e1e1e;
            --text: #e0e0e0;
            --text2: #888;
            --accent: #4a6cf7;
            --border: #2a2a2a;
            --radius: 2px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background-color 0.8s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 520px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            transition: background-color 0.5s ease;
        }

        .mode-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            background: var(--surface);
            padding: 6px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        /* Timer */
        .timer-section {
            text-align: center;
            padding: 8px 0;
        }

        .timer {
            font-size: clamp(56px, 12vw, 80px);
            font-weight: 200;
            letter-spacing: -2px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            transition: color 0.5s ease;
        }

        .date-label {
            font-size: 13px;
            color: var(--text2);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* Hex Display */
        .hex-display {
            text-align: center;
            font-family: 'SF Mono', monospace;
            font-size: 22px;
            letter-spacing: 2px;
            color: var(--text2);
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius);
            transition: all var(--transition);
            position: relative;
        }

        .hex-display:hover {
            color: var(--text);
            background: rgba(255,255,255,0.03);
        }

        .hex-display:active {
            transform: scale(0.98);
        }

        /* Composition Grid */
        .composition {
            background: var(--surface);
            border-radius: calc(var(--radius) * 4);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .composition-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 16px 0;
            margin-bottom: 12px;
        }

        .composition-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            font-weight: 500;
        }

        .composition-subtitle {
            font-size: 10px;
            color: var(--text2);
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            padding: 3px;
            aspect-ratio: 1;
        }

        .cell {
            border-radius: var(--radius);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'SF Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .cell:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell-time {
            position: absolute;
            bottom: 4px;
            font-size: 8px;
            opacity: 0.7;
        }

        /* Controls */
        .controls {
            background: var(--surface);
            border-radius: calc(var(--radius) * 4);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .control-panel {
            padding: 18px;
            border-bottom: 1px solid var(--border);
        }

        .control-panel:last-child {
            border-bottom: none;
        }

        .mode-toggle {
            display: flex;
            gap: 2px;
            background: var(--border);
            border-radius: var(--radius);
            padding: 2px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            border-radius: calc(var(--radius) - 1px);
            transition: all var(--transition);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .mode-btn.active {
            background: var(--surface2);
            color: var(--text);
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-label {
            min-width: 55px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            font-weight: 600;
        }

        .control-value {
            min-width: 48px;
            text-align: right;
            font-size: 13px;
            font-weight: 500;
            font-family: 'SF Mono', monospace;
            color: var(--text);
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            background: var(--border);
            border-radius: var(--radius);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: var(--radius);
            background: white;
            cursor: pointer;
            border: 2px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        .hue-slider {
            background: linear-gradient(to right,
                hsl(0, 100%, 50%),
                hsl(60, 100%, 50%),
                hsl(120, 100%, 50%),
                hsl(180, 100%, 50%),
                hsl(240, 100%, 50%),
                hsl(300, 100%, 50%),
                hsl(360, 100%, 50%)) !important;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all var(--transition);
            text-transform: uppercase;
            text-align: center;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            background: #5a7cf7;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface2);
            color: var(--text);
            padding: 10px 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 12px;
            letter-spacing: 0.5px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .app {
                padding: 16px;
                gap: 14px;
            }
            
            .timer {
                font-size: 48px;
            }
            
            .control-row {
                gap: 8px;
            }
            
            .btn {
                padding: 14px 10px;
                font-size: 10px;
            }
            
            input[type="range"] {
                height: 12px;
            }
            
            input[type="range"]::-webkit-slider-thumb {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-dot" id="logoDot"></div>
                TimeMe
            </div>
            <div class="mode-badge" id="modeBadge">24h cycle</div>
        </div>

        <!-- Timer -->
        <div class="timer-section">
            <div class="timer" id="timer">00:00:00</div>
            <div class="date-label" id="dateLabel">Loading...</div>
        </div>

        <!-- Hex Display -->
        <div class="hex-display" id="hexDisplay">#000000</div>

        <!-- Composition Grid -->
        <div class="composition">
            <div class="composition-header">
                <span class="composition-title">Capture Grid</span>
                <span class="composition-subtitle" id="gridInfo">16 frames • 1s interval</span>
            </div>
            <div class="grid" id="grid"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-panel">
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="realtime">24h Day</button>
                    <button class="mode-btn" data-mode="minute">60s Minute</button>
                </div>
                
                <div class="control-row">
                    <span class="control-label">HUE</span>
                    <input type="range" min="0" max="360" value="0" class="hue-slider" id="hueSlider">
                    <span class="control-value" id="hueValue">0°</span>
                </div>
                <div class="control-row">
                    <span class="control-label">SAT</span>
                    <input type="range" min="0" max="100" value="65" id="satSlider">
                    <span class="control-value" id="satValue">65%</span>
                </div>
                <div class="control-row">
                    <span class="control-label">LIGHT</span>
                    <input type="range" min="0" max="100" value="40" id="lightSlider">
                    <span class="control-value" id="lightValue">40%</span>
                </div>
            </div>

            <div class="control-panel">
                <div class="actions">
                    <button class="btn primary" id="downloadBtn">⬇ Export PNG</button>
                    <button class="btn" id="copyGridBtn">📋 Copy Grid</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============ STATE ============
        const state = {
            mode: 'realtime',
            baseHue: 0,
            manualHueOffset: 0,
            saturation: 65,
            lightness: 40,
            colorHistory: [],
            maxHistory: 16,
            captureInterval: 1000,
        };

        // ============ DOM ============
        const $ = (id) => document.getElementById(id);
        const els = {
            logoDot: $('logoDot'),
            modeBadge: $('modeBadge'),
            timer: $('timer'),
            dateLabel: $('dateLabel'),
            hexDisplay: $('hexDisplay'),
            grid: $('grid'),
            gridInfo: $('gridInfo'),
            hueSlider: $('hueSlider'),
            hueValue: $('hueValue'),
            satSlider: $('satSlider'),
            satValue: $('satValue'),
            lightSlider: $('lightSlider'),
            lightValue: $('lightValue'),
            toast: $('toast'),
        };

        // ============ UTILS ============
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }

        function getColor() {
            const h = ((state.baseHue + state.manualHueOffset) % 360 + 360) % 360;
            return {
                h, s: state.saturation, l: state.lightness,
                hex: hslToHex(h, state.saturation, state.lightness),
                hsl: `hsl(${Math.round(h)}, ${Math.round(state.saturation)}%, ${Math.round(state.lightness)}%)`
            };
        }

        function showToast(msg) {
            els.toast.textContent = msg;
            els.toast.classList.add('show');
            setTimeout(() => els.toast.classList.remove('show'), 1800);
        }

        // ============ COLOR CAPTURE ============
        function captureColor() {
            const color = getColor();
            const now = new Date();
            state.colorHistory.unshift({
                ...color,
                timestamp: Date.now(),
                timeStr: now.toLocaleTimeString('en-US', { 
                    hour12: false, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                }),
                ms: now.getMilliseconds()
            });
            
            if (state.colorHistory.length > state.maxHistory) {
                state.colorHistory.length = state.maxHistory;
            }
            
            renderGrid();
        }

        function renderGrid() {
            els.grid.innerHTML = '';
            
            for (let i = 0; i < state.maxHistory; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if (i < state.colorHistory.length) {
                    const c = state.colorHistory[i];
                    cell.style.backgroundColor = c.hex;
                    cell.innerHTML = `
                        <span>${c.hex}</span>
                        <span class="cell-time">${c.timeStr}</span>
                    `;
                    cell.title = `${c.hex}\n${c.timeStr}\nH:${Math.round(c.h)}° S:${Math.round(c.s)}% L:${Math.round(c.l)}%`;
                    cell.addEventListener('click', () => {
                        navigator.clipboard.writeText(c.hex);
                        showToast(`${c.hex} copied`);
                    });
                } else {
                    cell.style.backgroundColor = 'rgba(255,255,255,0.02)';
                }
                
                els.grid.appendChild(cell);
            }
            
            // Update grid info
            els.gridInfo.textContent = `${state.colorHistory.length} frames • 1s interval`;
        }

        // ============ UI UPDATE ============
        function updateUI() {
            const color = getColor();
            
            // Logo dot & timer color
            els.logoDot.style.backgroundColor = color.hsl;
            els.timer.style.color = color.hsl;
            
            // Hex
            els.hexDisplay.textContent = color.hex;
            
            // Sliders
            els.hueSlider.value = color.h;
            els.hueValue.textContent = `${Math.round(color.h)}°`;
            els.satSlider.value = state.saturation;
            els.satValue.textContent = `${Math.round(state.saturation)}%`;
            els.lightSlider.value = state.lightness;
            els.lightValue.textContent = `${Math.round(state.lightness)}%`;
            
            // Body background - subtle tint
            document.body.style.backgroundColor = `hsl(${color.h}, ${Math.min(state.saturation, 10)}%, 4%)`;
        }

        function updateTimer() {
            const now = new Date();
            els.timer.textContent = now.toLocaleTimeString('en-US', { 
                hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });
            
            const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            els.dateLabel.textContent = now.toLocaleDateString('en-US', opts);
            
            if (state.mode === 'realtime') {
                const ms = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) * 1000 + now.getMilliseconds();
                state.baseHue = (ms / 86400000) * 360;
            } else {
                const ms = (now.getSeconds() * 1000) + now.getMilliseconds();
                state.baseHue = (ms / 60000) * 360;
            }
        }

        // ============ IMAGE GENERATION ============
        function generateImage() {
            const canvas = document.createElement('canvas');
            const gridSize = 4;
            const cellSize = 200;
            const padding = 40;
            const headerHeight = 60;
            const footerHeight = 50;
            
            canvas.width = gridSize * cellSize + padding * 2;
            canvas.height = gridSize * cellSize + headerHeight + footerHeight + padding * 2;
            
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Header: "TimeMe" branding
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('TimeMe', padding, padding + 35);
            
            ctx.fillStyle = '#888888';
            ctx.font = '12px -apple-system, sans-serif';
            ctx.fillText(
                `${new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' })}`,
                padding, padding + 55
            );
            
            const modeStr = state.mode === 'realtime' ? '24h Day Cycle' : '60s Minute Cycle';
            ctx.textAlign = 'right';
            ctx.fillText(modeStr, canvas.width - padding, padding + 35);
            ctx.fillText(
                `Hue offset: ${state.manualHueOffset >= 0 ? '+' : ''}${Math.round(state.manualHueOffset)}°`,
                canvas.width - padding, padding + 55
            );
            
            // Grid
            const gridStartX = padding;
            const gridStartY = padding + headerHeight;
            
            for (let row = 0; row < gridSize; row++) {
                for (let col = 0; col < gridSize; col++) {
                    const index = row * gridSize + col;
                    const x = gridStartX + col * cellSize;
                    const y = gridStartY + row * cellSize;
                    
                    if (index < state.colorHistory.length) {
                        const c = state.colorHistory[index];
                        ctx.fillStyle = c.hex;
                    } else {
                        ctx.fillStyle = '#1a1a1a';
                    }
                    
                    ctx.fillRect(x, y, cellSize, cellSize);
                    
                    // Cell border
                    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x, y, cellSize, cellSize);
                    
                    // Cell content
                    if (index < state.colorHistory.length) {
                        const c = state.colorHistory[index];
                        const textColor = c.l > 55 ? '#000000' : '#ffffff';
                        
                        // Hex code
                        ctx.fillStyle = textColor;
                        ctx.font = 'bold 18px "SF Mono", "Cascadia Code", monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(c.hex, x + cellSize / 2, y + cellSize / 2 - 8);
                        
                        // Timestamp
                        ctx.font = '13px "SF Mono", monospace';
                        ctx.globalAlpha = 0.8;
                        ctx.fillText(c.timeStr, x + cellSize / 2, y + cellSize / 2 + 20);
                        ctx.globalAlpha = 1;
                    }
                }
            }
            
            // Footer
            const footerY = gridStartY + gridSize * cellSize + 20;
            ctx.fillStyle = '#888888';
            ctx.font = '11px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('time-me · color capture documentation', canvas.width / 2, footerY + 15);
            
            // Download
            const link = document.createElement('a');
            link.download = `timeme-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Image exported!');
        }

        function copyGridAsText() {
            let text = `TimeMe • Color Capture Grid\n`;
            text += `${new Date().toLocaleString()}\n`;
            text += `Mode: ${state.mode === 'realtime' ? '24h Day' : '60s Minute'} | Hue offset: ${state.manualHueOffset >= 0 ? '+' : ''}${Math.round(state.manualHueOffset)}°\n`;
            text += `${'─'.repeat(50)}\n`;
            
            state.colorHistory.forEach((c, i) => {
                const idx = (i + 1).toString().padStart(2);
                text += `${idx}. ${c.hex}  ${c.timeStr}  H:${Math.round(c.h)}° S:${Math.round(c.s)}% L:${Math.round(c.l)}%\n`;
            });
            
            navigator.clipboard.writeText(text);
            showToast('Grid copied as text');
        }

        // ============ EVENTS ============
        function handleHueChange(e) {
            const rect = els.hueSlider.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const hue = percentage * 360;
            
            state.manualHueOffset = hue - state.baseHue;
            if (state.manualHueOffset > 180) state.manualHueOffset -= 360;
            if (state.manualHueOffset < -180) state.manualHueOffset += 360;
            
            updateUI();
        }

        // ============ INIT ============
        function init() {
            // Build empty grid
            for (let i = 0; i < state.maxHistory; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.backgroundColor = 'rgba(255,255,255,0.02)';
                els.grid.appendChild(cell);
            }
            
            // Hue slider events
            els.hueSlider.addEventListener('input', handleHueChange);
            els.hueSlider.addEventListener('touchstart', e => { e.preventDefault(); handleHueChange(e); });
            els.hueSlider.addEventListener('touchmove', e => { e.preventDefault(); handleHueChange(e); });
            
            // Sat & Light
            els.satSlider.addEventListener('input', e => {
                state.saturation = parseInt(e.target.value);
                updateUI();
            });
            els.lightSlider.addEventListener('input', e => {
                state.lightness = parseInt(e.target.value);
                updateUI();
            });
            
            // Hex copy
            els.hexDisplay.addEventListener('click', () => {
                navigator.clipboard.writeText(getColor().hex);
                showToast('Hex copied');
            });
            
            // Mode buttons
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.mode = btn.dataset.mode;
                    state.manualHueOffset = 0;
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    els.modeBadge.textContent = state.mode === 'realtime' ? '24h cycle' : '60s cycle';
                    showToast(`Switched to ${state.mode === 'realtime' ? '24-hour' : '60-second'} cycle`);
                });
            });
            
            // Actions
            $('downloadBtn').addEventListener('click', generateImage);
            $('copyGridBtn').addEventListener('click', copyGridAsText);
            
            // Capture interval
            setInterval(captureColor, state.captureInterval);
            
            // Animation loop
            function loop() {
                updateTimer();
                updateUI();
                requestAnimationFrame(loop);
            }
            loop();
        }
        
        init();
    </script>
</body>
</html>
